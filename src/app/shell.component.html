@if (!auth.isLoggedIn()) {

  <!-- ── Full-screen login ─────────────────────────────────── -->
  <app-login></app-login>

} @else {

<div class="shell" [class.shell--collapsed]="collapsed()">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar">

    <!-- Brand -->
    <div class="sidebar__brand">
      <span class="sidebar__brand-icon">▦</span>
      <span class="sidebar__brand-name">POS Suite</span>
      <div class="sidebar__indicators">
        <span
          class="indicator"
          [attr.data-state]="apiStatus()"
          [title]="apiStatus() === 'online' ? 'POS Server Online' : apiStatus() === 'offline' ? 'POS Server Offline — check API connection' : 'Checking POS Server…'"
        ></span>
        <span
          class="indicator indicator--ws"
          [attr.data-state]="scannerStatus()"
          [title]="'POS2MTS — Point-of-Sale to Mobile Transport Service: ' + (scannerStatus() === 'connected' ? 'Connected' : scannerStatus() === 'connecting' ? 'Connecting…' : 'Disconnected')"
        ></span>
      </div>
    </div>

    <!-- Nav links -->
    <nav class="sidebar__nav">
      <a class="nav-item" [class.nav-item--active]="activeRoute() === 'terminal'" (click)="navigate('terminal')" title="POS Terminal">
        <span class="nav-item__icon">⊞</span>
        <span class="nav-item__label">Terminal</span>
        <span class="nav-item__pip"></span>
      </a>
      <a class="nav-item" [class.nav-item--active]="activeRoute() === 'products'" (click)="navigate('products')" title="Products">
        <span class="nav-item__icon">⬡</span>
        <span class="nav-item__label">Products</span>
        <span class="nav-item__pip"></span>
      </a>
      <a class="nav-item" [class.nav-item--active]="activeRoute() === 'uom'" (click)="navigate('uom')" title="Units of Measure">
        <span class="nav-item__icon">⊛</span>
        <span class="nav-item__label">Units of Measure</span>
        <span class="nav-item__pip"></span>
      </a>
      <a class="nav-item" [class.nav-item--active]="activeRoute() === 'stock'" (click)="navigate('stock')" title="Stock Controller">
        <span class="nav-item__icon">⬢</span>
        <span class="nav-item__label">Stock</span>
        <span class="nav-item__pip"></span>
      </a>
      <a class="nav-item" [class.nav-item--active]="activeRoute() === 'admin'" (click)="navigate('admin')" title="Admin">
        <span class="nav-item__icon">⊙</span>
        <span class="nav-item__label">Admin</span>
        <span class="nav-item__pip"></span>
      </a>
    </nav>

    <!-- Session info + sign out -->
    <div class="sidebar__session">
      <div class="sidebar__user" [title]="auth.session()!.user.email">
        <span class="sidebar__user-icon">👤</span>
        <div class="sidebar__user-info">
          <span class="sidebar__user-name">{{ auth.session()!.user.fullName || auth.session()!.user.userName }}</span>
          <span class="sidebar__user-roles">{{ auth.session()!.roles.join(', ') || 'User' }}</span>
        </div>
      </div>
      <button class="sidebar__signout" (click)="auth.logout()" title="Sign Out">⏻</button>
    </div>

    <!-- Collapse toggle -->
    <button class="sidebar__toggle" (click)="toggleSidebar()" [title]="collapsed() ? 'Expand' : 'Collapse'">
      <span class="sidebar__toggle-icon">{{ collapsed() ? '›' : '‹' }}</span>
    </button>

  </aside>

  <!-- ── Main content ──────────────────────────────────────── -->
  <main class="shell__content">
    <app-root              [isActive]="activeRoute() === 'terminal'"  [class.route--hidden]="activeRoute() !== 'terminal'"  (scannerStatusChange)="onScannerStatus($event)"></app-root>
    <app-product-editor    [isActive]="activeRoute() === 'products'"  [class.route--hidden]="activeRoute() !== 'products'"  (scannerStatusChange)="onScannerStatus($event)"></app-product-editor>
    <app-uom-editor                                                    [class.route--hidden]="activeRoute() !== 'uom'"></app-uom-editor>
    <app-stock-controller  [isActive]="activeRoute() === 'stock'"     [class.route--hidden]="activeRoute() !== 'stock'"     (scannerStatusChange)="onScannerStatus($event)"></app-stock-controller>
    <app-auth                                                          [class.route--hidden]="activeRoute() !== 'admin'"></app-auth>
  </main>

</div>

}
